# The scheduled data job and the deploy (SPEC.md 3, 4.3; module 7).
#
# Every 6 hours, on every push to main, and by hand ("Run workflow"):
#   1. restore the download cache (.data-cache) and the last good data files from the previous
#      run (GitHub's Actions cache), so the polite-fetch rules see what was fetched when;
#   2. run the tests, then the data job. The job asks each source at most once, and only when
#      its cached copy is older than the source's refresh interval (packages/data-job/src/
#      sources.ts), so a push shortly after a scheduled run downloads nothing;
#   3. on success, save the cache for the next run, build the site and upload it to
#      Cloudflare Pages.
# Any HTTP error or failed sanity check stops the run before the deploy: the live site keeps
# its previous data and GitHub emails the owner. Nothing here ever retries.
#
# Secrets (docs/hosting.md): CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: Data and deploy

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC (off the hour, when GitHub's runners are busiest)
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Never two runs at once: both would ask CelesTrak for the same data, and the second would get
# a 403. A run that arrives while one is going waits for it.
concurrency:
  group: data-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: satviewer

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The data job takes about 6 min on a desktop (most of it the closest-meetings screening).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore the download cache and the last good data
        uses: actions/cache/restore@v4
        with:
          path: |
            .data-cache
            packages/web/public/data
          # Each run saves under its own key; restore-keys picks the newest earlier one.
          key: data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-

      - run: pnpm typecheck
      - run: pnpm test

      - name: Data job (CelesTrak, GCAT; closest meetings)
        run: pnpm data

      - name: Save the download cache and the data for the next run
        uses: actions/cache/save@v4
        with:
          path: |
            .data-cache
            packages/web/public/data
          key: data-${{ github.run_id }}-${{ github.run_attempt }}

      - run: pnpm --filter @sat-viewer/web build

      - name: Create the Pages project on the first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm dlx wrangler@4 pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists."
          else
            pnpm dlx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4 pages deploy packages/web/dist
          --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
